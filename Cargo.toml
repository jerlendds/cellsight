[package]
name = "cellsight"
version = "0.1.0"
edition = "2024"

[features]
default = ["wayland", "x11"]
wayland = ["gpui/wayland", "gpui_platform/wayland"]
x11 = ["gpui/x11", "gpui_platform/x11"]

[dependencies]
gpui = { path = "zed/crates/gpui", default-features = false }
gpui_platform = { path = "zed/crates/gpui_platform", default-features = false }
image = { version = "0.25", default-features = false, features = ["jpeg"] }
raw-window-handle = "0.6.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
smallvec = "1"
tokio = { version = "1", features = ["sync", "time"] }
tokio-stream = "0.1"
x11rb = { version = "0.14.0", features = [
    "randr",
    "render",
    "xfixes",
    "shape",
] }
