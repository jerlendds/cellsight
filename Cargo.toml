[package]
name = "cellsight"
version = "0.1.0"
edition = "2024"

[workspace]
exclude = ["zed"]
members = [
    "crates/button",
    "crates/color-picker",
    "crates/icon-button",
    "crates/icon-only-button",
    "crates/info-channel",
    "crates/focus-profile",
    "crates/section-header",
    "crates/selector",
    "crates/slider",
    "crates/text-input",
]

[features]
default = ["wayland", "x11"]
wayland = ["gpui/wayland", "gpui_platform/wayland"]
x11 = ["gpui/x11", "gpui_platform/x11"]

[dependencies]
cellsight-button = { path = "crates/button" }
cellsight-color-picker = { path = "crates/color-picker" }
cellsight-icon-button = { path = "crates/icon-button" }
cellsight-icon-only-button = { path = "crates/icon-only-button" }
cellsight-info-channel = { path = "crates/info-channel" }
cellsight-focus-profile = { path = "crates/focus-profile" }
cellsight-section-header = { path = "crates/section-header" }
cellsight-selector = { path = "crates/selector" }
cellsight-slider = { path = "crates/slider" }
cellsight-text-input = { path = "crates/text-input" }
gpui = { path = "zed/crates/gpui", default-features = false }
gpui_platform = { path = "zed/crates/gpui_platform", default-features = false }
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
raw-window-handle = "0.6.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
smallvec = "1"
tokio = { version = "1", features = ["sync", "time"] }
tokio-stream = "0.1"
x11rb = { version = "0.14.0", features = [
    "randr",
    "render",
    "xfixes",
    "shape",
] }
